    <text x="32" y="38" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="-0.8" fill="#111">NO<tspan letter-spacing="-4.5">R</tspan>THWIND</text>
  </g>
  <g transform="translate(410 310)">
