  <g fill="#f3ebdd" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-weight="700">
    <text x="400" y="225" text-anchor="middle" font-size="120" letter-spacing="-6">NO<tspan letter-spacing="-38">R</tspan>THWIND</text>
  </g>
  <g transform="translate(330 300)">
